[package]
name = "datalayer-driver-napi"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
name = "datalayer_driver"

[dependencies]
datalayer-driver = { path = ".." }
napi = { version = "2.12.2", default-features = false, features = ["napi6", "async"] }
napi-derive = "2.12.2"

# Re-export needed dependencies from the main crate
chia = "0.22.0"
chia-puzzles = "0.20.1"
thiserror = "1.0.61"
clvmr = "0.13.1"
tokio = "1.39.3"
chia-wallet-sdk = { version = "0.24.0", features = ["chip-0035", "native-tls", "peer-simulator"] }
hex-literal = "0.4.1"
num-bigint = "0.4.6"
hex = "0.4.3"
rand = "0.8"
futures-util = "0.3"

[target.aarch64-unknown-linux-gnu.dependencies]
openssl = { version = "0.10.64", features = ["vendored"] }
openssl-sys = { version = "0.9.102", features = ["vendored"] }

[target.aarch64-unknown-linux-musl.dependencies]
openssl = { version = "0.10.64", features = ["vendored"] }
openssl-sys = { version = "0.9.102", features = ["vendored"] }

[target.x86_64-unknown-linux-gnu.dependencies]
openssl = { version = "0.10.64", features = ["vendored"] }
openssl-sys = { version = "0.9.102", features = ["vendored"] }

[target.x86_64-unknown-linux-musl.dependencies]
openssl = { version = "0.10.64", features = ["vendored"] }
openssl-sys = { version = "0.9.102", features = ["vendored"] }

[build-dependencies]
napi-build = "2.0.1"
